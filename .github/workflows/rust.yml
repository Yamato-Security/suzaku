name: Rust

on:
  # A run triggered by `pull_request` saves its cache under that PR's own scope, which
  # no other PR can read. Only caches written on the default branch are restorable by
  # every PR, so without this `push` trigger there is never a warm cache to restore and
  # each PR pays a full cold build of the bundled DuckDB C++ engine.
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        info:
          # NOTE: Reduced to Windows x86_64 only to cut GitHub Actions usage.
          # The full platform matrix still runs in release.yml. Uncomment the
          # entries below to restore per-push/PR coverage for the other targets.
          # - {
          #   os: "ubuntu-latest",
          #   target: "x86_64-unknown-linux-gnu",
          #   cross: false,
          # }
          # - {
          #   os: "ubuntu-latest",
          #   target: "x86_64-unknown-linux-musl",
          #   cross: true,
          # }
          # - { os: "macOS-latest", target: "x86_64-apple-darwin", cross: false }
          # - { os: "macOS-latest", target: "aarch64-apple-darwin", cross: false }
          - {
            os: "windows-latest",
            target: "x86_64-pc-windows-msvc",
            cross: false,
          }
          # - {
          #   os: "windows-latest",
          #   target: "i686-pc-windows-msvc",
          #   cross: true,
          # }
    runs-on: ${{ matrix.info.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Set up Rust toolchain
        if: ${{ steps.skip_check.outputs.should_skip != 'true' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: ${{ matrix.info.target }}
      - name: Enable Rust cache
        if: ${{ steps.skip_check.outputs.should_skip != 'true' }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Bumped from the implicit v0 to discard the existing ~2.1 GB cache, which was
          # written under the old layout where clippy and the tests used separate target
          # directories and every artifact was stored twice. rust-cache skips saving on a
          # full key match ("Cache up-to-date"), so without a new prefix the stale cache
          # would survive until Cargo.lock or the toolchain changed. Costs one cold run.
          prefix-key: v1-rust
      - name: Fmt Check
        run: cargo fmt -- --check
      # `--target` must match the "Build tests"/"Run tests" steps below. Without it clippy
      # builds into `target/debug` while those build into `target/<triple>/debug`, so the
      # bundled DuckDB C++ engine gets compiled once per directory and the cache ends up
      # holding two full copies of every artifact.
      - name: Run clippy action to produce annotations
        run: cargo clippy --all-targets --target=${{ matrix.info.target }} -- -D warnings
      - name: Install dependencies for musl
        if: matrix.info.os == 'ubuntu-latest' && matrix.info.cross == true
        run: |
          sudo apt update
          sudo apt install -y musl-tools libssl-dev pkg-config
      - name: Install cross
        if: matrix.info.os == 'ubuntu-latest' && matrix.info.cross == true
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build tests
        if: ${{ steps.skip_check.outputs.should_skip != 'true' }}
        uses: ClementTsang/cargo-action@2438cc5f3ba4e971289fffca2a00dedea6911f14 # v0.0.7
        with:
          command: test
          args: --no-run --locked ${{ matrix.features }} --target=${{ matrix.info.target }}
          use-cross: ${{ matrix.info.cross }}
          cross-version: 0.2.4
        env:
          RUST_BACKTRACE: full
          OPENSSL_STATIC: "1"
          PKG_CONFIG_ALLOW_CROSS: "1"
      # `--target` must match the "Build tests" step above. Cargo puts artifacts in
      # `target/<triple>/debug` when `--target` is passed and in `target/debug` when it
      # is not, even where host == target, so omitting it here made this step rebuild
      # the entire dependency tree from scratch — including the bundled DuckDB C++
      # engine — instead of reusing what "Build tests" just built.
      - name: Run tests
        env:
          RUST_TEST_THREADS: 1
        run: cargo test --verbose --target=${{ matrix.info.target }}
